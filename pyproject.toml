[project]
name = "uae-market-advisor"
version = "0.1.0"
description = "An Agno advisor for a Jordanian restaurant expanding into the UAE"
requires-python = ">=3.12"
dependencies = [
    "agno>=3.1.3",
    "openai>=3.29.0",
    "pydantic>=2.0",
    "python-dotenv>=1.2.4",
    "rich>=14.0",
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
